<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden | Raphdi-LoGaKo</title>
<style>
  :root { --dunkel: #132238; --blau: #1769aa; --grau: #637083; --rand: #d6dee8; }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--dunkel);
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eaf4fb, #f8fbfd 55%, #dce9f3);
  }
  .anmeldung {
    width: min(100%, 440px);
    padding: 40px;
    background: #fff;
    border: 1px solid rgba(19, 34, 56, .1);
    border-radius: 12px;
    box-shadow: 0 18px 45px rgba(19, 34, 56, .14);
  }
  .marke { margin: 0 0 8px; color: var(--blau); font-weight: bold; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 2rem; }
  .beschreibung { margin: 10px 0 28px; color: var(--grau); line-height: 1.5; }
  label { display: block; margin: 18px 0 7px; font-weight: bold; }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--rand);
    border-radius: 6px;
    font-size: 1rem;
  }
  input:focus { outline: 3px solid rgba(23, 105, 170, .2); border-color: var(--blau); }
  .optionen { display: flex; align-items: center; gap: 8px; margin: 16px 0 24px; color: var(--grau); font-weight: normal; }
  .optionen input { width: auto; margin: 0; }
  button {
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 6px;
    background-color: var(--blau);
    color: #fff;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background-color: #125789; }
  .status { min-height: 24px; margin: 16px 0 0; color: #a33a2b; font-size: .95rem; text-align: center; }
  .hilfe { margin: 24px 0 0; color: var(--grau); font-size: .9rem; text-align: center; }
  @media screen and (max-width: 480px) { .anmeldung { padding: 28px 22px; } }
</style>
</head>
<body>
<main class="anmeldung">
  <p class="marke">Raphdi-LoGaKo</p>
  <h1>Anmelden</h1>
  <p class="beschreibung">Melde dich an, um zur Familien-Startseite zu gelangen.</p>

  <form id="anmeldeformular" action="Startseite.html" method="post" novalidate>
    <label for="benutzername">Benutzername</label>
    <input id="benutzername" name="benutzername" type="text" autocomplete="username" placeholder="Benutzername eingeben" required>

    <label for="passwort">Passwort</label>
    <input id="passwort" name="passwort" type="password" autocomplete="current-password" placeholder="Passwort eingeben" required>

    <label class="optionen" for="angemeldet-bleiben">
      <input id="angemeldet-bleiben" name="angemeldet-bleiben" type="checkbox">
      Angemeldet bleiben
    </label>

    <button type="submit">Anmelden</button>
    <p id="status" class="status" role="alert" aria-live="polite"></p>
  </form>

  <p class="hilfe">Passwort vergessen? Bitte wende dich an Ralph oder Raphael.</p>
</main>

<script>
// Hinweis: Die Anmeldung ist ohne Server nur eine Weiterleitung.
// Eine echte Passwort-Prüfung ist auf statischem Hosting nicht möglich.
const anmeldeformular = document.getElementById('anmeldeformular');
const status = document.getElementById('status');

anmeldeformular.addEventListener('submit', (ereignis) => {
  ereignis.preventDefault();

  if (!anmeldeformular.checkValidity()) {
    status.textContent = 'Bitte Benutzername und Passwort eingeben.';
    anmeldeformular.reportValidity();
    return;
  }

  window.location.href = anmeldeformular.action;
});
</script>

</body>
</html>
