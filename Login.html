<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Arial, Helvetica, sans-serif;}

input[type=text], input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

button {
  background-color: #04AA6D;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
}

button:hover {
  opacity: 0.8;
}

.cancelbtn {
  width: auto;
  padding: 10px 18px;
  background-color: #f44336;
}

.imgcontainer {
  text-align: center;
  margin: 24px 0 12px 0;
  position: relative;
}

img.avatar {
  width: 40%;
  border-radius: 50%;
}

.container {
  padding: 16px;
}

span.psw {
  float: right;
  padding-top: 16px;
}

.modal {
  display: none;
  position: fixed; 
  z-index: 1; 
  left: 0;
  top: 0;
  width: 100%; 
  height: 100%;
  overflow: auto;
  background-color: rgb(0,0,0);
  background-color: rgba(0,0,0,0.4);
  padding-top: 60px;
}


.modal-content {
  background-color: #fefefe;
  margin: 5% auto 15% auto;
  border: 1px solid #888;
  width: 80%; 
}
.close {
  position: absolute;
  right: 25px;
  top: 0;
  color: #000;
  font-size: 35px;
  font-weight: bold;
}

.close:hover,
.close:focus {
  color: red;
  cursor: pointer;
}

.animate {
  -webkit-animation: animatezoom 0.6s;
  animation: animatezoom 0.6s
}

@-webkit-keyframes animatezoom {
  from {-webkit-transform: scale(0)} 
  to {-webkit-transform: scale(1)}
}
  
@keyframes animatezoom {
  from {transform: scale(0)} 
  to {transform: scale(1)}
}


@media screen and (max-width: 300px) {
  span.psw {
     display: block;
     float: none;
  }
  .cancelbtn {
     width: 100%;
  }
}

/* Moderne Grundgestaltung der deutschen Anmeldeseite. */
:root { --dunkel: #132238; --blau: #1769aa; --grau: #637083; --rand: #d6dee8; }
* { box-sizing: border-box; }
body {
  min-height: 100vh;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  color: var(--dunkel);
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #eaf4fb, #f8fbfd 55%, #dce9f3);
}
.anmeldung {
  width: min(100%, 440px);
  padding: 40px;
  background: #fff;
  border: 1px solid rgba(19, 34, 56, .1);
  border-radius: 12px;
  box-shadow: 0 18px 45px rgba(19, 34, 56, .14);
}
.marke { margin: 0 0 8px; color: var(--blau); font-weight: bold; letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 0; font-size: 2rem; }
.beschreibung { margin: 10px 0 28px; color: var(--grau); line-height: 1.5; }
label { display: block; margin: 18px 0 7px; font-weight: bold; }
input[type=text], input[type=password] { border: 1px solid var(--rand); border-radius: 6px; }
input:focus { outline: 3px solid rgba(23, 105, 170, .2); border-color: var(--blau); }
.optionen { display: flex; align-items: center; gap: 8px; margin: 16px 0 24px; color: var(--grau); font-weight: normal; }
.optionen input { width: auto; margin: 0; }
button { background-color: var(--blau); border-radius: 6px; font-weight: bold; }
button:hover { background-color: #125789; opacity: 1; }
.status { min-height: 24px; margin: 16px 0 0; color: #a33a2b; font-size: .95rem; }
.hilfe { margin: 24px 0 0; color: var(--grau); font-size: .9rem; text-align: center; }
@media screen and (max-width: 480px) { .anmeldung { padding: 28px 22px; } }
</style>
</head>
<body>
<main class="anmeldung">
  <p class="marke">Raphdi-LoGaKo</p>
  <h1>Anmelden</h1>
  <p class="beschreibung">Melde dich an, um zur Startseite zu gelangen.</p>

  <!-- Die action-Adresse kann später durch den echten Server-Endpunkt ersetzt werden. -->
  <form id="anmeldeformular" action="Start.html" method="post" novalidate>
    <label for="benutzername">Benutzername</label>
    <input id="benutzername" name="benutzername" type="text" autocomplete="username" placeholder="Benutzername eingeben" required>

    <label for="passwort">Passwort</label>
    <input id="passwort" name="passwort" type="password" autocomplete="current-password" placeholder="Passwort eingeben" required>

    <label class="optionen" for="angemeldet-bleiben">
      <input id="angemeldet-bleiben" name="angemeldet-bleiben" type="checkbox">
      Angemeldet bleiben
    </label>

    <button type="submit">Anmelden</button>
    <p id="status" class="status" role="alert" aria-live="polite"></p>
  </form>

  <p class="hilfe">Passwort vergessen? Bitte wende dich an Ralph oder Raphael.</p>
</main>

<script>
// Das Formular ist für einen späteren Server vorbereitet.
// Bis dahin wird nach der Eingabe direkt die Startseite geöffnet.
const anmeldeformular = document.getElementById('anmeldeformular');
const status = document.getElementById('status');

anmeldeformular.addEventListener('submit', (ereignis) => {
  ereignis.preventDefault();

  // Leere Felder werden vor dem Weiterleiten verständlich gemeldet.
  if (!anmeldeformular.checkValidity()) {
    status.textContent = 'Bitte Benutzername und Passwort eingeben.';
    anmeldeformular.reportValidity();
    return;
  }

  // Für eine echte Anmeldung hier später die Server-Antwort prüfen.
  window.location.href = anmeldeformular.action;
});
</script>

</body>
</html>
